services:
  postgres:
    image: postgres:16-alpine
    container_name: ahpunjab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahpunjab
      POSTGRES_PASSWORD: ahpunjab_dev_2024
      POSTGRES_DB: ahpunjab_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - ./Database/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./Database/init/02-geo-seed.sql:/docker-entrypoint-initdb.d/02-geo-seed.sql
      - ./Database/init/02-seed-semen-types.sql:/docker-entrypoint-initdb.d/02-seed-semen-types.sql
      - ./Database/init/03-test-seed.sql:/docker-entrypoint-initdb.d/03-test-seed.sql
      - ./Database/init/04-seed-monthly-reports.sql:/docker-entrypoint-initdb.d/04-seed-monthly-reports.sql
      - ./Database/init/05-seed-notifications.sql:/docker-entrypoint-initdb.d/05-seed-notifications.sql
      - ./Database/migrations/002-report-alignment.sql:/docker-entrypoint-initdb.d/06-migration-002.sql
      - ./Database/init/07-seed-talwandi-sabo.sql:/docker-entrypoint-initdb.d/07-seed-talwandi-sabo.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahpunjab -d ahpunjab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    container_name: ahpunjab-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ahpunjab_db
      DB_USER: ahpunjab
      DB_PASSWORD: ahpunjab_dev_2024
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./ahpunjabfrontend
    container_name: ahpunjab-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ahpunjab-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  pgadmin_data:
    name: ahpunjab_pgadmin_data
