name: ahpunjab

services:
  postgres:
    image: postgres:16-alpine
    container_name: ahpunjab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahpunjab
      POSTGRES_PASSWORD: ahpunjab_dev_2024
      POSTGRES_DB: ahpunjab_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Consolidated schema + seeds (run in order on first init / empty volume)
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./Database/seed-geo.sql:/docker-entrypoint-initdb.d/02-seed-geo.sql
      - ./Database/seed-login.sql:/docker-entrypoint-initdb.d/03-seed-login.sql
      - ./Database/seed-other.sql:/docker-entrypoint-initdb.d/04-seed-other.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahpunjab -d ahpunjab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    container_name: ahpunjab-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ahpunjab_db
      DB_USER: ahpunjab
      DB_PASSWORD: ahpunjab_dev_2024
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./PWA
    container_name: ahpunjab-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ahpunjab-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  pgadmin_data:
    name: ahpunjab_pgadmin_data
