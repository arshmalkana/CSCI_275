services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ahpunjab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahpunjab
      POSTGRES_PASSWORD: ahpunjab_dev_2024
      POSTGRES_DB: ahpunjab_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # ====================================================================
      # AUTOMATIC MIGRATIONS (run on every docker-compose up)
      # Migrations run automatically when volume is NOT persisted
      # ====================================================================
      # 01: Complete schema with all tables (includes WebAuthn, auth, etc.)
      - ./init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # 02: Complete Punjab geography (21 districts, 84 tehsils, 12,354 villages)
      - ./init/02-geo-seed.sql:/docker-entrypoint-initdb.d/02-geo-seed.sql
      - ./init/02-seed-semen-types.sql:/docker-entrypoint-initdb.d/02-seed-semen-types.sql
      # 03: Test data with "test" user (username: test, password: test)
      - ./init/03-test-seed.sql:/docker-entrypoint-initdb.d/03-test-seed.sql
      - ./init/04-seed-monthly-reports.sql:/docker-entrypoint-initdb.d/04-seed-monthly-reports.sql
      - ./init/05-seed-notifications.sql:/docker-entrypoint-initdb.d/05-seed-notifications.sql

      # ====================================================================
      # DATA PERSISTENCE CONTROL
      # ====================================================================
      # COMMENTED OUT: Data is NOT persisted - migrations run on every startup
      # This is ideal for development to always have fresh, consistent data
      # - postgres_data:/var/lib/postgresql/data

      # UNCOMMENT FOR PRODUCTION: Data persists between restarts
      # Migrations only run once when volume is first created
      # postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahpunjab -d ahpunjab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Optional - Web UI for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ahpunjab-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
    name: ahpunjab_postgres_data
  pgadmin_data:
    name: ahpunjab_pgadmin_data
